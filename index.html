<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pragma — Centro de Salud Inteligente</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #0f172a;
      color: #e2e8f0;
    }
    .container { text-align: center; padding: 2rem; }
    h1 { font-size: 3rem; font-weight: 700; background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p { margin-top: 1rem; color: #94a3b8; font-size: 1.125rem; }
    .badge { margin-top: 2rem; display: inline-block; padding: 0.5rem 1rem; background: #1e293b; border-radius: 999px; font-size: 0.875rem; color: #38bdf8; border: 1px solid #334155; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Pragma</h1>
    <p>Infraestructura de software médico · Oberá, Misiones</p>
    <div class="badge">Próximamente</div>
  </div>
</body>
</html>
