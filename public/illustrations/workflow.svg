<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" rx="16" fill="#00003A"/>
  <!-- top bar -->
  <rect x="30" y="30" width="540" height="50" rx="12" fill="rgba(255,255,255,0.04)"/>
  <circle cx="55" cy="55" r="8" fill="rgba(0,0,255,0.3)"/>
  <rect x="75" y="50" width="120" height="8" rx="4" fill="rgba(255,255,255,0.15)"/>
  <rect x="500" y="48" width="50" height="16" rx="8" fill="rgba(0,0,255,0.3)"/>
  <!-- input area -->
  <rect x="30" y="100" width="540" height="60" rx="12" fill="rgba(255,255,255,0.06)"/>
  <rect x="50" y="120" width="300" height="8" rx="4" fill="rgba(255,255,255,0.12)"/>
  <rect x="50" y="138" width="200" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
  <rect x="520" y="118" width="34" height="24" rx="8" fill="rgba(0,0,255,0.3)"/>
  <!-- arrow -->
  <path d="M 300 160 L 300 185 L 280 185" stroke="rgba(255,255,255,0.15)" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6" fill="rgba(255,255,255,0.15)"/>
    </marker>
  </defs>
  <!-- evidence box -->
  <rect x="30" y="195" width="540" height="80" rx="12" fill="rgba(255,255,255,0.04)"/>
  <rect x="50" y="210" width="100" height="6" rx="3" fill="rgba(123,47,190,0.3)"/>
  <rect x="50" y="228" width="400" height="6" rx="3" fill="rgba(255,255,255,0.1)"/>
  <rect x="50" y="244" width="350" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
  <rect x="50" y="260" width="280" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
  <!-- second arrow -->
  <path d="M 300 275 L 300 295 L 280 295" stroke="rgba(255,255,255,0.15)" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
  <defs>
    <marker id="arrow2" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6" fill="rgba(255,255,255,0.15)"/>
    </marker>
  </defs>
  <!-- response box -->
  <rect x="30" y="305" width="540" height="75" rx="12" fill="rgba(0,0,255,0.06)" stroke="rgba(0,0,255,0.15)" stroke-width="1"/>
  <rect x="50" y="320" width="80" height="6" rx="3" fill="rgba(0,0,255,0.3)"/>
  <rect x="50" y="338" width="480" height="6" rx="3" fill="rgba(255,255,255,0.12)"/>
  <rect x="50" y="354" width="420" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
  <rect x="50" y="370" width="160" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
</svg>